name: Instalador Windows

# Gera o pacote completo (Setup .exe + ZIP portátil, com Tesseract e português)
# a cada push que mexa no app. Em tags v*, publica também uma Release.
on:
  push:
    # Com "tags" definido, sem "branches" o GitHub não rodaria em pushes de branch.
    branches: ['**']
    tags: ['v*']
    # Filtro de caminhos vale para branches (tags sempre disparam).
    paths:
      - '*.py'
      - 'src/**'
      - 'public/**'
      - 'tests/**'
      - 'instalador/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'requirements*.txt'
      - '.github/workflows/instalador-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  instalador:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Dependências Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Versão
        id: versao
        run: |
          $v = (python -c "from versao import VERSAO_APP; print(VERSAO_APP)").Trim()
          "versao=$v" >> $env:GITHUB_OUTPUT

      - name: Cache do Tesseract
        uses: actions/cache@v4
        with:
          path: build/Tesseract-OCR
          key: tesseract-${{ hashFiles('instalador/build.ps1') }}

      - name: Gerar pacote completo (build.ps1)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./instalador/build.ps1

      - name: Testar o instalador (instala, faz OCR, desinstala)
        run: ./instalador/testar_instalador.ps1 -Setup "saida/VisaoOCRPro-Setup-${{ steps.versao.outputs.versao }}.exe"

      - name: Publicar o instalador
        uses: actions/upload-artifact@v4
        with:
          name: VisaoOCRPro-Setup-${{ steps.versao.outputs.versao }}
          path: |
            saida/VisaoOCRPro-Setup-*.exe
            saida/SHA256SUMS.txt
          retention-days: 90

      - name: Publicar o ZIP portátil
        uses: actions/upload-artifact@v4
        with:
          name: VisaoOCRPro-${{ steps.versao.outputs.versao }}-portatil
          path: saida/VisaoOCRPro-*-portatil.zip
          retention-days: 90

      - name: Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            saida/VisaoOCRPro-Setup-*.exe
            saida/VisaoOCRPro-*-portatil.zip
            saida/SHA256SUMS.txt
